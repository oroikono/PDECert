name: Hub pilot integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_DATASETS_DISABLE_PROGRESS_BARS: "1"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/hub-integration.txt
      - run: python -m pip install -e ".[dev]" -r requirements/hub-integration.txt
      - run: python -m pip check
      - name: Offline installed-library and failure-path tests
        env:
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        run: python -m pytest -q tests/test_hub_pilot_smoke.py
      - name: Anonymous live round trip at the immutable pilot revision
        if: github.event_name == 'workflow_dispatch'
        run: python -m experiments.hub_pilot_smoke --from-hub
