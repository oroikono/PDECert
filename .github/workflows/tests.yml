name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest

  autodiff:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,autodiff]"
      - run: python -m pytest tests/test_autodiff.py
      - run: python -m pytest tests/test_trained_burgers_pair.py
      - run: >-
          python -m experiments.burgers_pinn_fixture
          benchmarks/matched/burgers-classical-01/pinn.json
          benchmarks/matched/burgers-classical-01/integrity.json
      - run: python -m examples.autodiff_heat
      - run: python -m examples.matched_heat
      - run: python -m experiments.trained_burgers_pair

  agents:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,agents]"
      - run: python -m pytest tests/test_agents.py tests/test_agent_runtime.py tests/test_smolagents_integration.py
      - run: python -m examples.agent_repair_loop

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke test wheel and source installs
        run: |
          python -m venv "$RUNNER_TEMP/pdecert-wheel"
          "$RUNNER_TEMP/pdecert-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pdecert-wheel/bin/python" -c "import pdecert"
          "$RUNNER_TEMP/pdecert-wheel/bin/pdecert" --help
          "$RUNNER_TEMP/pdecert-wheel/bin/pdecert" quickstart --json
          "$RUNNER_TEMP/pdecert-wheel/bin/pdecert" verify \
            "$GITHUB_WORKSPACE/examples/exact_heat.json"
          cd "$GITHUB_WORKSPACE"
          python -m venv "$RUNNER_TEMP/pdecert-sdist"
          "$RUNNER_TEMP/pdecert-sdist/bin/python" -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pdecert-sdist/bin/python" -c "import pdecert"
          "$RUNNER_TEMP/pdecert-sdist/bin/pdecert" --help
          "$RUNNER_TEMP/pdecert-sdist/bin/pdecert" quickstart --json
