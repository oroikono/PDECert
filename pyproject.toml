[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pdecert"
version = "0.1.1rc2"
description = "Conservative verification for machine-generated PDE solution artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Orestis Oikonomou", email = "ooikonomou@ethz.ch" },
]
keywords = ["partial-differential-equations", "scientific-machine-learning", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "mpmath>=1.3,<2",
  "sympy>=1.13,<2",
]

[project.scripts]
pdecert = "pdecert.cli:main"

[project.optional-dependencies]
collection = [
  "huggingface_hub==1.27.0",
  "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
autodiff = [
  "torch>=2.4",
]
agents = [
  "smolagents>=1.26,<2",
]
dev = [
  "pytest>=8",
  "ruff==0.12.5",
]

[project.urls]
Changelog = "https://github.com/oroikono/PDECert/blob/main/CHANGELOG.md"
Repository = "https://github.com/oroikono/PDECert"
Issues = "https://github.com/oroikono/PDECert/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pdecert"]

[tool.hatch.build.targets.sdist]
include = [
  "/ARCHITECTURE.md",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/LIMITATIONS_AND_THREATS_TO_VALIDITY.md",
  "/README.md",
  "/RELEASE.md",
  "/ROADMAP.md",
  "/assets",
  "/benchmarks",
  "/corpus",
  "/docs",
  "/examples",
  "/experiments",
  "/requirements",
  "/results",
  "/schema",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
