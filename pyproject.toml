[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pdecert"
version = "0.1.0"
description = "Conservative verification for machine-generated PDE solution artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Orestis Oikonomou", email = "ooikonomou@ethz.ch" },
]
keywords = ["partial-differential-equations", "scientific-machine-learning", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "mpmath>=1.3,<2",
  "sympy>=1.13,<2",
]

[project.scripts]
pdecert = "pdecert.cli:main"

[project.optional-dependencies]
collection = [
  "huggingface_hub==1.27.0",
  "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
autodiff = [
  "torch>=2.4",
]
dev = [
  "pytest>=8",
  "ruff==0.12.5",
]

[project.urls]
Repository = "https://github.com/oroikono/PDECert"
Issues = "https://github.com/oroikono/PDECert/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pdecert"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
